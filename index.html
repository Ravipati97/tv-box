<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme class before first paint (no flash of the wrong
      // theme). Kept in sync at runtime by ThemeContext, which is the
      // source of truth after React mounts -- this just resolves the same
      // preference synchronously, before anything renders.
      (function () {
        try {
          var stored = localStorage.getItem('tvbox-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.classList.add(theme)
          // The apple-touch-icon href (light/dark) is kept in sync by
          // ThemeContext instead of here -- unlike this class, which must be
          // set before first paint to avoid a visible flash, nothing reads
          // that href until someone actually taps "Add to Home Screen," so
          // there's no flash to avoid, and doing it in ThemeContext means it
          // stays correct if the theme is toggled mid-session too (a
          // one-time swap here wouldn't have re-run on that).
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS's "Add to Home Screen" ignores the SVG favicon above (Safari
         needs a raster apple-touch-icon) -- without this it falls back to a
         screenshot of the page as the home screen icon instead of the
         actual logo. 180x180 covers current devices; the smaller sizes are
         for older iPads/iPhones that still ask for them explicitly. The
         id="apple-touch-icon" one is the one ThemeContext swaps between
         light/dark as the theme changes; the media-queried pair below is
         the spec-correct declaration for browsers that do honor it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" id="apple-touch-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Opens full-screen from the home screen (no Safari chrome) and uses
         this title under the icon instead of falling back to the page's
         <title>. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TV Box" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#08080c" />
    <meta name="description" content="TV Box — track and rate TV shows, episode by episode." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <title>TV Box</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
